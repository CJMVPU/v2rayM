name: macOS product validation

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'codex/**']
    paths: ['v2rayN/**', 'macos/**', 'scripts/**', 'contracts/**', 'patches/xray/**', 'VERSION', 'global.json', 'AGENTS.md', 'docs/upstream-merge-policy.md', '.github/workflows/macos-backend.yml']
  pull_request:
    paths: ['v2rayN/**', 'macos/**', 'scripts/**', 'contracts/**', 'patches/xray/**', 'VERSION', 'global.json', 'AGENTS.md', 'docs/upstream-merge-policy.md', '.github/workflows/macos-backend.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check product boundaries and language contract
        run: |
          python3 scripts/check-macos-product-boundaries.py
          python3 scripts/generate-helper-contract.py --check
          python3 scripts/test-macos-build-manifest.py
          python3 scripts/test-macos-product-boundaries.py
          python3 scripts/test-core-packaging.py
          python3 scripts/test-macos-signing-identity.py
          python3 scripts/test-macos-geo-download.py
          bash v2rayN/v2rayN.WebAPI/Tests/Integration/test-release-packaging.sh
      - name: Verify backend and shared proxy logic before packaging
        run: |
          dotnet test --project v2rayN/ServiceLib.Tests --configuration Release
          dotnet test --project v2rayN/v2rayN.WebAPI/Tests --configuration Release
      - name: Prepare pinned offline city data
        run: python3 scripts/prepare-macos-geo.py
      - name: Test native client and signed-helper policies without installing services
        run: |
          swift test --package-path macos/TunHelper --scratch-path "$RUNNER_TEMP/helper-tests"
          swift test --package-path macos/Native --scratch-path "$RUNNER_TEMP/native-tests"
      - name: Upload reproducible Geo outputs for product build
        uses: actions/upload-artifact@v7
        with:
          name: macos-geodata
          path: macos/Native/Sources/V2rayM/Resources/Globe

  product:
    needs: validate
    runs-on: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Read reviewed Go toolchain version
        id: toolchain
        run: echo "version=$(python3 -c 'import json; print(json.load(open("contracts/macos-build-inputs.json"))["goVersion"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: macos-geodata
          path: macos/Native/Sources/V2rayM/Resources/Globe
      - name: Prepare pinned core data and verified Darwin repair
        shell: bash
        run: |
          case "$(uname -m)" in arm64) rid=osx-arm64 ;; x86_64) rid=osx-x64 ;; *) exit 1 ;; esac
          bash scripts/fetch-macos-cores.sh "$rid" "$RUNNER_TEMP/native-cores"
          python3 scripts/build-macos-xray.py --output "$RUNNER_TEMP/repaired-xray"
          cp "$RUNNER_TEMP/repaired-xray/"{xray,LICENSE,SOURCE.txt} "$RUNNER_TEMP/native-cores/xray/"
      - name: Build one source-consistent native product and exercise loopback traffic
        run: python3 scripts/build-macos-product.py --output "$RUNNER_TEMP/product" --core-bin "$RUNNER_TEMP/native-cores"
      - name: Archive verified development product
        run: ditto -c -k --keepParent "$RUNNER_TEMP/product/v2rayM.app" "$RUNNER_TEMP/v2rayM-development.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-native-development
          path: |
            ${{ runner.temp }}/v2rayM-development.zip
            ${{ runner.temp }}/product/verification.json
            ${{ runner.temp }}/product/source-snapshot.json
            ${{ runner.temp }}/product/product-manifest.json
